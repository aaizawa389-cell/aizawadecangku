<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>♡ Relationship Canvas | CP / CB 关系图</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f6;color:#29272a;font:14px system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1200px;margin:auto;padding:18px}h1{font-size:23px;margin:4px 0}.sub{color:#777;margin:4px 0 16px}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}button,input,select{font:inherit;border:1px solid #d8d4d7;border-radius:9px;background:white;padding:9px 11px;color:inherit}button{cursor:pointer}button:hover{background:#f1edf0}button.active{background:#f5dfe9;border-color:#d59bb5}.muted{font-size:12px;color:#777}.wrap{overflow:auto;background:#fff;border:1px solid #dedade;border-radius:14px}.board{position:relative;width:1000px;height:720px;background:white;touch-action:pan-x pan-y}.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.hit{fill:none;stroke:transparent;stroke-width:24;pointer-events:stroke;cursor:pointer}.path{fill:none;stroke-width:2.5;pointer-events:none}.node{position:absolute;width:108px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;touch-action:none;user-select:none;z-index:2}.node:active{cursor:grabbing}.avatar{height:80px;width:80px;border-radius:50%;border:2px solid #cfc4cb;background:#f2eaf0;display:grid;place-items:center;overflow:hidden;font-size:25px;color:#665c63}.avatar img{width:100%;height:100%;object-fit:cover;pointer-events:none}.node .nm{font-size:13px;max-width:108px;text-align:center;overflow-wrap:anywhere;background:#ffffffd9;border-radius:4px;padding:1px 3px}.node.selected .avatar{outline:3px solid #e7b2ca}.note{position:absolute;width:155px;min-height:26px;transform:translate(-50%,-50%);border:1px solid transparent;background:rgba(255,255,255,.85);border-radius:5px;resize:none;overflow:hidden;text-align:center;padding:3px 5px;font:13px/1.35 system-ui,-apple-system,"PingFang SC",sans-serif;color:#383238;z-index:3}.note:focus{outline:none;border:1px dashed #d5a1b6;background:white}.note.selected{border:1px dashed #dfb5c7}.handle{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #b782a0;transform:translate(-50%,-50%);z-index:5;cursor:move;touch-action:none}.panel{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:10px 0}.panel label{display:flex;align-items:center;gap:6px}.panel input[type=color]{padding:2px;width:38px;height:34px}.panel input[type=range]{width:100px}.hidden{display:none!important}.help{font-size:12px;color:#777;margin:10px 0}.pill{background:#f3edf1;border-radius:12px;padding:5px 9px}footer{text-align:center;color:#999;padding:20px;font-size:12px}#preview{position:fixed;inset:0;z-index:100;background:#18161be8;overflow:auto;padding:20px;text-align:center;color:white}#preview img{max-width:100%;height:auto;background:white}#preview button{display:block;margin:0 0 15px auto}#fileImport{display:none}@media(max-width:650px){main{padding:12px}h1{font-size:20px}.bar button{padding:8px}.panel{font-size:12px}}
</style></head><body><main><h1>♡ Relationship Canvas</h1><div class="sub">多人 CP / CB 关系图 · 双向独立箭头 · 自由布局</div>
<div class="bar"><button id="add">＋ 添加角色</button><button id="move" class="active">✋ 移动角色</button><button id="connect">↗ 添加箭头</button><button id="ring">◯ 环形布局</button><button id="star">✳ 中心辐射</button><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button></div>
<div class="bar"><button id="save">保存项目</button><button id="load">导入项目</button><input type="file" id="fileImport" accept=".json,application/json"><button id="png">导出 PNG</button><button id="reset">清空画布</button><span class="muted" id="status">自动保存在当前浏览器</span></div>
<div id="edgePanel" class="panel hidden"><span class="pill" id="edgeTitle">箭头设置</span><label>颜色 <input id="color" type="color" value="#dd99b0"></label><label>线型 <select id="dash"><option value="solid">实线</option><option value="dash">虚线</option></select></label><label>弧度 <input id="curve" type="range" min="-220" max="220" step="5"></label><button id="reverse">反向复制</button><button id="deleteEdge">删除箭头</button><span class="muted">拖动图中的小圆点也可调整弧度</span></div>
<div id="nodePanel" class="panel hidden"><span class="pill" id="nodeTitle"></span><label>名字 <input id="nodeName" type="text" maxlength="40"></label><label>照片 <input id="nodeImage" type="file" accept="image/*"></label><button id="deleteNode">删除角色</button></div>
<div class="wrap"><div class="board" id="board"><svg class="edges" id="svg" viewBox="0 0 1000 720"></svg><div id="nodes"></div><div id="notes"></div><div id="handles"></div></div></div>
<div class="help">移动模式：拖动头像改变位置；点击头像可修改名字或照片。添加箭头模式：依次点击起点和终点角色。点击箭头可改颜色，点击箭头旁的文字直接输入。可用滚动查看完整画布。</div><footer>制表人：aizawa · 本工具不会上传你的角色照片</footer></main><div id="preview" class="hidden"><button id="closePreview">关闭预览 ×</button><p>长按图片即可保存到照片（iPhone / iPad）</p><img id="previewImg" alt="导出的关系图"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),W=1000,H=720,KEY='relationship-canvas-v1',palette=['#e3a0b8','#8ab99c','#a99bc9','#dfb27c','#8eaccb'];
let state={nodes:[],edges:[]},mode='move',pending=null,selectedNode=null,selectedEdge=null,history=[],future=[],dragging=false;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.nodes)&&Array.isArray(saved.edges))state=saved;}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));$('status').textContent='已自动保存';}catch(e){$('status').textContent='浏览器存储不足，请导出项目备份';}}
function snapshot(){history.push(JSON.stringify(state));if(history.length>50)history.shift();future=[];}
function commit(){persist();render();}
function nodeBy(id){return state.nodes.find(n=>n.id===id)}
function edgeBy(id){return state.edges.find(e=>e.id===id)}
function layout(kind){snapshot();const ns=state.nodes,n=ns.length;if(!n)return;const cx=W/2,cy=H/2;if(kind==='star'){const central=selectedNode&&nodeBy(selectedNode)||ns[0];central.x=cx;central.y=cy;const others=ns.filter(x=>x!==central);others.forEach((p,i)=>{const a=-Math.PI/2+2*Math.PI*i/others.length;p.x=cx+310*Math.cos(a);p.y=cy+245*Math.sin(a);});}else ns.forEach((p,i)=>{const a=-Math.PI/2+2*Math.PI*i/n;p.x=cx+330*Math.cos(a);p.y=cy+260*Math.sin(a);});commit();}
function geom(e){const a=nodeBy(e.from),b=nodeBy(e.to);if(!a||!b)return null;const dx=b.x-a.x,dy=b.y-a.y,len=Math.max(1,Math.hypot(dx,dy)),ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
const offset=e.curve??(state.edges.some(t=>t.from===e.to&&t.to===e.from)?-65:45);
const start={x:a.x+ux*48,y:a.y+uy*48},end={x:b.x-ux*48,y:b.y-uy*48};
const ctrl={x:(start.x+end.x)/2+nx*offset*2,y:(start.y+end.y)/2+ny*offset*2};
const mid={x:(start.x+2*ctrl.x+end.x)/4,y:(start.y+2*ctrl.y+end.y)/4};
const tangent={x:end.x-ctrl.x,y:end.y-ctrl.y},ang=Math.atan2(tangent.y,tangent.x);
return {start,end,ctrl,mid,ang,offset,nx,ny};}
function svgEl(tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el;}
function render(){
$('move').classList.toggle('active',mode==='move');$('connect').classList.toggle('active',mode==='connect');$('connect').textContent=pending?'选择终点角色…':'↗ 添加箭头';
$('nodePanel').classList.toggle('hidden',!selectedNode);$('edgePanel').classList.toggle('hidden',!selectedEdge);
const n=nodeBy(selectedNode),e=edgeBy(selectedEdge);if(!n)selectedNode=null;if(!e)selectedEdge=null;
$('nodePanel').classList.toggle('hidden',!n);$('edgePanel').classList.toggle('hidden',!e);
if(n){$('nodeTitle').textContent='角色设置';if(document.activeElement!==$('nodeName'))$('nodeName').value=n.name;}
if(e){$('edgeTitle').textContent=(nodeBy(e.from)?.name||'角色')+' → '+(nodeBy(e.to)?.name||'角色');$('color').value=e.color||palette[0];$('dash').value=e.dash||'solid';$('curve').value=e.curve??45;}
const svg=$('svg');svg.replaceChildren();const nodes=$('nodes'),notes=$('notes'),handles=$('handles');nodes.replaceChildren();notes.replaceChildren();handles.replaceChildren();
for(const edge of state.edges){const g=geom(edge);if(!g)continue;const d='M '+g.start.x+' '+g.start.y+' Q '+g.ctrl.x+' '+g.ctrl.y+' '+g.end.x+' '+g.end.y;
const group=svgEl('g',{});const path=svgEl('path',{d,class:'path',stroke:edge.color||palette[0],'stroke-dasharray':edge.dash==='dash'?'7 6':'none'});group.append(path);
const size=12,aa=g.ang,tip=g.end;const arrow=svgEl('path',{d:'M '+(tip.x-size*Math.cos(aa-.48))+' '+(tip.y-size*Math.sin(aa-.48))+' L '+tip.x+' '+tip.y+' L '+(tip.x-size*Math.cos(aa+.48))+' '+(tip.y-size*Math.sin(aa+.48)),stroke:edge.color||palette[0],'stroke-width':2.5,fill:'none','stroke-linejoin':'round'});group.append(arrow);
const hit=svgEl('path',{d,class:'hit'});hit.style.pointerEvents='stroke';hit.addEventListener('click',()=>{selectedEdge=edge.id;selectedNode=null;render();});group.append(hit);svg.append(group);
const label=document.createElement('textarea');label.className='note'+(selectedEdge===edge.id?' selected':'');label.placeholder='点击填写感情…';label.value=edge.text||'';label.rows=1;label.style.left=(g.mid.x+(edge.tx||0))+'px';label.style.top=(g.mid.y+(edge.ty||0))+'px';label.style.height=Math.max(26,Math.min(110,26+(String(edge.text||'').split('\n').length-1)*17))+'px';
label.addEventListener('focus',()=>{selectedEdge=edge.id;selectedNode=null;});label.addEventListener('input',()=>{edge.text=label.value;label.style.height='auto';label.style.height=Math.max(26,label.scrollHeight)+'px';persist();});notes.append(label);
if(selectedEdge===edge.id){const h=document.createElement('div');h.className='handle';h.style.left=g.ctrl.x+'px';h.style.top=g.ctrl.y+'px';handles.append(h);drag(h,(p)=>{const gg=geom(edge);if(!gg)return;edge.curve=clamp(Math.round(((p.x-(gg.start.x+gg.end.x)/2)*gg.nx+(p.y-(gg.start.y+gg.end.y)/2)*gg.ny)/2),-220,220);render();});}
}
for(const p of state.nodes){const el=document.createElement('div');el.className='node'+(selectedNode===p.id?' selected':'');el.style.left=p.x+'px';el.style.top=p.y+'px';const av=document.createElement('div');av.className='avatar';if(p.image){const img=document.createElement('img');img.src=p.image;av.append(img);}else av.textContent=(p.name||'?').slice(0,1);const name=document.createElement('div');name.className='nm';name.textContent=p.name;el.append(av,name);nodes.append(el);
el.addEventListener('click',ev=>{ev.stopPropagation();if(dragging){dragging=false;return;}if(mode==='connect'){if(!pending){pending=p.id;render();}else if(pending!==p.id){const from=pending;pending=null;if(!state.edges.some(e=>e.from===from&&e.to===p.id)){snapshot();const reverse=state.edges.find(e=>e.from===p.id&&e.to===from);const edge={id:uid(),from,to:p.id,text:'',color:palette[state.edges.length%palette.length],curve:reverse?-(reverse.curve??45):45,dash:'solid'};state.edges.push(edge);selectedEdge=edge.id;selectedNode=null;commit();}else render();}}else{selectedNode=p.id;selectedEdge=null;render();}});
if(mode==='move')drag(el,pos=>{p.x=clamp(pos.x,65,W-65);p.y=clamp(pos.y,65,H-65);el.style.left=p.x+'px';el.style.top=p.y+'px';render();},true);
}
}
function point(ev){const r=$('board').getBoundingClientRect();return {x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height};}
function drag(el,onMove,nodeDrag=false){let start=null,moved=false;el.addEventListener('pointerdown',ev=>{if(ev.button!==0)return;start=point(ev);moved=false;el.setPointerCapture(ev.pointerId);ev.preventDefault();});el.addEventListener('pointermove',ev=>{if(!start)return;const p=point(ev);if(Math.hypot(p.x-start.x,p.y-start.y)>4){if(!moved){snapshot();moved=true;}onMove(p);}});const end=()=>{if(!start)return;start=null;if(moved){dragging=nodeDrag;commit();}};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);}
function add(){if(state.nodes.length>=9){alert('最多添加 9 位角色。');return;}snapshot();const i=state.nodes.length,a=-Math.PI/2+i*2*Math.PI/Math.max(3,i+1);const p={id:uid(),name:'角色 '+(i+1),x:500+260*Math.cos(a),y:360+230*Math.sin(a),image:''};state.nodes.push(p);selectedNode=p.id;selectedEdge=null;commit();}
$('add').onclick=add;$('move').onclick=()=>{mode='move';pending=null;render();};$('connect').onclick=()=>{mode='connect';pending=null;render();};$('ring').onclick=()=>layout('ring');$('star').onclick=()=>layout('star');
$('nodeName').oninput=()=>{const n=nodeBy(selectedNode);if(n){n.name=$('nodeName').value;persist();const el=[...$('nodes').children].find(x=>x.classList.contains('selected'));if(el){el.querySelector('.nm').textContent=n.name;if(!n.image)el.querySelector('.avatar').textContent=n.name.slice(0,1);}}};
$('nodeName').onfocus=()=>snapshot();
$('nodeImage').onchange=ev=>{const file=ev.target.files[0],n=nodeBy(selectedNode);if(!file||!n)return;const reader=new FileReader();reader.onload=()=>{snapshot();n.image=String(reader.result);commit();};reader.readAsDataURL(file);ev.target.value='';};
$('deleteNode').onclick=()=>{if(!nodeBy(selectedNode))return;snapshot();state.nodes=state.nodes.filter(n=>n.id!==selectedNode);state.edges=state.edges.filter(e=>e.from!==selectedNode&&e.to!==selectedNode);selectedNode=null;commit();};
$('color').oninput=()=>{const e=edgeBy(selectedEdge);if(e){e.color=$('color').value;persist();render();}};$('color').onfocus=()=>snapshot();
$('dash').onchange=()=>{const e=edgeBy(selectedEdge);if(e){snapshot();e.dash=$('dash').value;commit();}};
$('curve').oninput=()=>{const e=edgeBy(selectedEdge);if(e){e.curve=Number($('curve').value);persist();render();}};$('curve').onpointerdown=()=>snapshot();
$('deleteEdge').onclick=()=>{snapshot();state.edges=state.edges.filter(e=>e.id!==selectedEdge);selectedEdge=null;commit();};
$('reverse').onclick=()=>{const e=edgeBy(selectedEdge);if(!e)return;if(state.edges.some(x=>x.from===e.to&&x.to===e.from)){alert('反向箭头已经存在。');return;}snapshot();const rev={...e,id:uid(),from:e.to,to:e.from,text:'',curve:-(e.curve??45)};state.edges.push(rev);selectedEdge=rev.id;commit();};
$('undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify(state));state=JSON.parse(history.pop());selectedEdge=null;selectedNode=null;commit();};
$('redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify(state));state=JSON.parse(future.pop());selectedEdge=null;selectedNode=null;commit();};
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
$('save').onclick=()=>download(new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),'CP-CB-关系图项目.json');
$('load').onclick=()=>$('fileImport').click();$('fileImport').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.nodes)||!Array.isArray(obj.edges)||obj.nodes.length>9)throw Error('项目格式无效或人数超过9人');snapshot();state={nodes:obj.nodes,edges:obj.edges};selectedEdge=null;selectedNode=null;commit();}catch(e){alert('导入失败：'+e.message);}ev.target.value='';};
$('reset').onclick=()=>{if(!confirm('确定清空整张关系图吗？'))return;snapshot();state={nodes:[],edges:[]};selectedEdge=null;selectedNode=null;commit();};
$('closePreview').onclick=()=>$('preview').classList.add('hidden');
function wrap(ctx,text,x,y,maxWidth,lineHeight=17){const lines=String(text||'').split('\n');let yy=y;ctx.textAlign='center';for(const line of lines){let segment='';for(const char of line){if(ctx.measureText(segment+char).width>maxWidth&&segment){ctx.fillText(segment,x,yy);yy+=lineHeight;segment=char;}else segment+=char;}ctx.fillText(segment,x,yy);yy+=lineHeight;} }
$('png').onclick=async()=>{const btn=$('png');btn.disabled=true;btn.textContent='正在生成…';try{const scale=2,canvas=document.createElement('canvas');canvas.width=W*scale;canvas.height=H*scale;const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
for(const e of state.edges){const g=geom(e);if(!g)continue;ctx.strokeStyle=e.color||palette[0];ctx.lineWidth=2.5;ctx.setLineDash(e.dash==='dash'?[7,6]:[]);ctx.beginPath();ctx.moveTo(g.start.x,g.start.y);ctx.quadraticCurveTo(g.ctrl.x,g.ctrl.y,g.end.x,g.end.y);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(g.end.x-12*Math.cos(g.ang-.48),g.end.y-12*Math.sin(g.ang-.48));ctx.lineTo(g.end.x,g.end.y);ctx.lineTo(g.end.x-12*Math.cos(g.ang+.48),g.end.y-12*Math.sin(g.ang+.48));ctx.stroke();
if(e.text){ctx.font='13px sans-serif';const lines=String(e.text).split('\n');const y=g.mid.y+(e.ty||0);ctx.fillStyle='rgba(255,255,255,.94)';ctx.fillRect(g.mid.x+(e.tx||0)-79,y-13,158,Math.max(24,lines.length*17+7));ctx.fillStyle='#383238';wrap(ctx,e.text,g.mid.x+(e.tx||0),y,150);}}
for(const n of state.nodes){ctx.fillStyle='#f2eaf0';ctx.beginPath();ctx.arc(n.x,n.y-10,40,0,Math.PI*2);ctx.fill();if(n.image){const img=new Image();img.src=n.image;try{await img.decode();ctx.save();ctx.beginPath();ctx.arc(n.x,n.y-10,38,0,Math.PI*2);ctx.clip();const ratio=Math.max(76/img.naturalWidth,76/img.naturalHeight);const iw=img.naturalWidth*ratio,ih=img.naturalHeight*ratio;ctx.drawImage(img,n.x-iw/2,n.y-10-ih/2,iw,ih);ctx.restore();}catch(err){}}else{ctx.fillStyle='#665c63';ctx.font='25px sans-serif';ctx.textAlign='center';ctx.fillText((n.name||'?').slice(0,1),n.x,n.y-2);}ctx.strokeStyle='#cfc4cb';ctx.lineWidth=2;ctx.beginPath();ctx.arc(n.x,n.y-10,40,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#29272a';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText(n.name||'',n.x,n.y+48,108);}
ctx.fillStyle='rgba(80,80,80,.65)';ctx.textAlign='right';ctx.font='12px sans-serif';ctx.fillText('制表人：aizawa',W-18,22);
const blob=await new Promise((ok,bad)=>canvas.toBlob(b=>b?ok(b):bad(Error('图片生成失败')),'image/png'));const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);if(ios){const url=URL.createObjectURL(blob);$('previewImg').src=url;$('preview').classList.remove('hidden');}else download(blob,'CP-CB-关系图.png');
}catch(err){alert('导出失败：'+err.message);}finally{btn.disabled=false;btn.textContent='导出 PNG';}};
if(!state.nodes.length){for(let i=0;i<3;i++){const a=-Math.PI/2+2*Math.PI*i/3;state.nodes.push({id:uid(),name:['A','B','C'][i],x:500+290*Math.cos(a),y:360+240*Math.sin(a),image:''});}persist();}
render();
})();
</script></body></html>
